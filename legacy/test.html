<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,
initial-scale=1.0">
    <title>Simple Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .timer-container {
            text-align: center;
        }
        .timer {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .controls {
            margin: 20px;
        }
        .button {
            padding: 10px 20px;
            font-size: 1em;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="timer-container">
        <h1 class="timer" id="timer">00:00:00</h1>
        <div class="controls">
            <button class="button" id="startBtn">Start</button>
            <button class="button" id="pauseBtn"
disabled>Pause</button>
            <button class="button" id="resetBtn">Reset</button>
        </div>
    </div>

    <script>
        let timerInterval;
        let seconds = 0;
        let minutes = 0;
        let hours = 0;

        function updateTimer() {
            const timerDisplay = document.getElementById('timer');
            const formattedTime = `${String(hours).padStart(2,
'0')}:${String(minutes).padStart(2,
'0')}:${String(seconds).padStart(2, '0')}`;
            timerDisplay.textContent = formattedTime;

            seconds++;
            if (seconds === 60) {
                seconds = 0;
                minutes++;
                if (minutes === 60) {
                    minutes = 0;
                    hours++;
                }
            }
        }

        function startTimer() {
            timerInterval = setInterval(updateTimer, 1000);
            document.getElementById('startBtn').disabled = true;
            document.getElementById('pauseBtn').disabled = false;
            document.getElementById('resetBtn').disabled = false;
        }

document.getElementById('startBtn').addEventListener('click', () => {
            startTimer();
        });


document.getElementById('pauseBtn').addEventListener('click', ()=> {
            clearInterval(timerInterval);
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = false;
});


document.getElementById('resetBtn').addEventListener('click', ()=> {
            clearInterval(timerInterval);
            seconds = 0;
            minutes = 0;
            hours = 0;
            document.getElementById('timer').textContent =
'00:00:00';
            document.getElementById('startBtn').disabled = false;
            document.getElementById('pauseBtn').disabled = true;
            document.getElementById('resetBtn').disabled = true;
        });
    </script>
</body>
</html>
