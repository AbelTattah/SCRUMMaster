<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offline — Scrum Master</title>
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      background: #FAFAFA;
      color: #1A1A1A;
      font-family: Poppins, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 40px 32px;
      background: #FFFFFF;
      border: 1px solid #EBEBEB;
      border-radius: 16px;
      box-shadow: 0 18px 50px rgba(33, 0, 93, 0.10);
    }
    .mark {
      display: grid;
      place-items: center;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 16px;
      background: linear-gradient(135deg, #2E0480, #160043);
      color: #FFFFFF;
      font-size: 30px;
      font-weight: 600;
    }
    h1 { margin: 0 0 8px; font-size: 22px; }
    p { margin: 0 0 24px; color: #727272; font-size: 15px; line-height: 1.6; }
    button {
      height: 44px;
      padding: 0 24px;
      border: 0;
      border-radius: 8px;
      background: #21005D;
      color: #FFFFFF;
      font: inherit;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #2E0480; }

    @media (prefers-color-scheme: dark) {
      body { background: #0E0E12; color: #E7E7EE; }
      .card { background: #1A1A21; border-color: #2A2A34; box-shadow: none; }
      p { color: #9C9CA8; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark">✓</div>
    <h1>You are offline</h1>
    <p>
      Scrum Master could not reach the network. Your tasks are safe — reconnect
      and pull to refresh.
    </p>
    <button onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
